# Site/DB only. Deploy the bot separately with the same INTERNAL_API_SECRET.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: legit
      POSTGRES_DB: legit_assets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}
    volumes:
      - legit_db:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legit -d legit_assets"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Intentionally no published database port.
  site:
    image: legit-assets-site:local
    build:
      context: ..
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set canonical HTTPS origin}
        NEXT_PUBLIC_MINI_APP_NAME: ${NEXT_PUBLIC_MINI_APP_NAME:-}
        SEO_ENABLED: ${SEO_ENABLED:-false}
    env_file: ../.env
    ports: ["127.0.0.1:3000:3000"]
    networks: [database, outbound]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 12s
      start_period: 30s
      retries: 3
    restart: unless-stopped
  worker:
    image: legit-assets-site:local
    env_file: ../.env
    init: true
    stop_grace_period: 120s
    command: ["node", "--import", "tsx", "--env-file-if-exists=.env", "scripts/commerce-worker.ts"]
    networks: [outbound]
    depends_on:
      site:
        condition: service_healthy
    restart: unless-stopped
networks:
  database:
    internal: true
  outbound: {}
volumes:
  legit_db: {}
